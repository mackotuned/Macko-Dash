<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350">
  <defs>
    <style>
      text { font-family: Consolas, monospace; fill: #17202a; letter-spacing: 0; }
      .title { font-family: Segoe UI, sans-serif; font-size: 34px; font-weight: 700; }
      .sub { font-family: Segoe UI, sans-serif; font-size: 18px; fill: #46515c; }
      .head { font-family: Segoe UI, sans-serif; font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .box { fill: #fff; stroke: #273746; stroke-width: 2; }
      .panel { fill: #f7f9f9; stroke: #85929e; stroke-width: 2; }
      .warn { fill: #fff4e5; stroke: #d68910; stroke-width: 2; }
      .keepout { fill: #fdecec; stroke: #c0392b; stroke-width: 2; stroke-dasharray: 8 6; }
      .signal { fill: none; stroke: #117864; stroke-width: 3; }
      .power { fill: none; stroke: #c0392b; stroke-width: 4; }
      .ground { fill: none; stroke: #1f618d; stroke-width: 4; }
      .contact { fill: none; stroke: #7d3c98; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1800" height="1350" fill="#eef2f3"/>
  <text x="55" y="58" class="title">MackoDash HVAC Node - Amazon Prime Relay Board</text>
  <text x="55" y="90" class="sub">ESP32-WROOM-32 | 3 x 4-channel 5 V relay modules | 2 x ULN2803A | ESP-NOW channel 6</text>

  <rect x="55" y="120" width="1690" height="150" rx="8" class="panel"/>
  <text x="75" y="153" class="head">Protected power</text>
  <rect x="75" y="178" width="155" height="55" class="box"/><text x="152" y="202" class="label" text-anchor="middle">IGN +12 V</text><text x="152" y="222" class="tiny" text-anchor="middle">switched</text>
  <line x1="230" y1="205" x2="300" y2="205" class="power"/>
  <rect x="300" y="178" width="120" height="55" class="box"/><text x="360" y="202" class="label" text-anchor="middle">F1 2 A</text><text x="360" y="222" class="tiny" text-anchor="middle">fuse</text>
  <line x1="420" y1="205" x2="545" y2="205" class="power"/>
  <text x="482" y="191" class="tiny" text-anchor="middle">D1 SMBJ24A to GND</text>
  <rect x="545" y="168" width="260" height="75" class="box"/><text x="675" y="197" class="label" text-anchor="middle">Automotive buck</text><text x="675" y="221" class="small" text-anchor="middle">9-36 V input / 5 V 3 A output</text>
  <line x1="805" y1="193" x2="1000" y2="193" class="power"/><line x1="805" y1="225" x2="1000" y2="225" class="ground"/>
  <rect x="1000" y="168" width="265" height="75" class="box"/><text x="1132" y="197" class="label" text-anchor="middle">5 V distribution</text><text x="1132" y="221" class="small" text-anchor="middle">ESP VIN + three relay boards</text>
  <rect x="1310" y="165" width="395" height="80" class="warn"/><text x="1508" y="194" class="label" text-anchor="middle">C1 1000 uF / 10 V+</text><text x="1508" y="218" class="small" text-anchor="middle">Never connect vehicle 12 V to ESP32 or relays</text>

  <rect x="55" y="300" width="400" height="810" rx="8" class="panel"/>
  <text x="255" y="338" class="head" text-anchor="middle">ESPDEVKITV1</text>
  <rect x="135" y="370" width="240" height="625" rx="18" fill="#17324d" stroke="#0b1f31" stroke-width="3"/>
  <rect x="158" y="390" width="194" height="125" class="keepout"/><text x="255" y="426" class="label" text-anchor="middle">ESP32-WROOM-32</text><text x="255" y="452" class="small" text-anchor="middle">ANTENNA KEEPOUT</text><text x="255" y="483" class="tiny" text-anchor="middle">board edge / no copper</text>
  <text x="255" y="560" class="label" text-anchor="middle">GPIO outputs</text>
  <g class="small">
    <text x="165" y="600">FAN: 16, 17, 18, 19</text>
    <text x="165" y="635">MODE: 23, 25, 26, 27</text>
    <text x="165" y="670">TEMP: 32, 33, 4, 13</text>
    <text x="165" y="720">VIN: regulated 5 V</text>
    <text x="165" y="755">GND: common logic ground</text>
  </g>
  <rect x="95" y="820" width="320" height="115" class="warn"/><text x="255" y="850" class="label" text-anchor="middle">No wire to rotary S3</text><text x="255" y="878" class="small" text-anchor="middle">Commands arrive by ESP-NOW.</text><text x="255" y="905" class="small" text-anchor="middle">Disconnect buck power for USB.</text>
  <text x="255" y="1030" class="small" text-anchor="middle">Socket on two 15-pin headers</text>

  <rect x="485" y="300" width="500" height="810" rx="8" class="panel"/>
  <text x="735" y="338" class="head" text-anchor="middle">GPIO protection / inversion</text>
  <rect x="525" y="375" width="420" height="315" rx="6" class="box"/>
  <text x="735" y="407" class="label" text-anchor="middle">U1 ULN2803A, DIP-18</text>
  <text x="550" y="438" class="small">ESP GPIO -> input pin -> output pin -> module input</text>
  <g class="small">
    <text x="555" y="474">16 -> 1 -> 18 -> FAN IN1</text><text x="555" y="504">17 -> 2 -> 17 -> FAN IN2</text>
    <text x="555" y="534">18 -> 3 -> 16 -> FAN IN3</text><text x="555" y="564">19 -> 4 -> 15 -> FAN IN4</text>
    <text x="555" y="594">23 -> 5 -> 14 -> MODE IN1</text><text x="555" y="624">25 -> 6 -> 13 -> MODE IN2</text>
    <text x="555" y="654">26 -> 7 -> 12 -> MODE IN3</text><text x="755" y="654">27 -> 8 -> 11 -> MODE IN4</text>
  </g>
  <rect x="525" y="720" width="420" height="265" rx="6" class="box"/>
  <text x="735" y="752" class="label" text-anchor="middle">U2 ULN2803A, DIP-18</text>
  <g class="small">
    <text x="555" y="792">32 -> 1 -> 18 -> TEMP IN1</text><text x="555" y="827">33 -> 2 -> 17 -> TEMP IN2</text>
    <text x="555" y="862">4 -> 3 -> 16 -> TEMP IN3</text><text x="555" y="897">13 -> 4 -> 15 -> TEMP IN4</text>
    <text x="555" y="937">Tie unused inputs 5-8 to GND.</text>
  </g>
  <text x="525" y="1025" class="small">Both ICs: pin 9 -> GND; pin 10 COM -> leave open.</text>
  <text x="525" y="1055" class="small">GPIO HIGH = ULN output LOW = relay ON.</text>

  <rect x="1015" y="300" width="730" height="810" rx="8" class="panel"/>
  <text x="1380" y="338" class="head" text-anchor="middle">Hosyond 4-channel relay modules</text>
  <text x="1380" y="365" class="small" text-anchor="middle">Amazon ASIN B0C2Z8JF5R | Set every channel jumper to LOW trigger</text>

  <g>
    <rect x="1050" y="395" width="660" height="205" rx="6" fill="#eaf7f1" stroke="#117864" stroke-width="2"/>
    <text x="1075" y="426" class="head">MODULE 1 - FAN</text>
    <text x="1075" y="455" class="small">5 V -> VCC/JD-VCC (jumper installed) | GND -> logic GND</text>
    <text x="1075" y="487" class="small">IN1 &lt;- U1 pin18   IN2 &lt;- pin17   IN3 &lt;- pin16   IN4 &lt;- pin15</text>
    <text x="1075" y="525" class="label">Contacts:</text><text x="1190" y="525" class="small">K1 NO->A   K2 NO->B   K3 NO->C   K4 NO->D</text>
    <text x="1075" y="558" class="small">Tie all four K1-K4 COM screw terminals to FAN COM. Leave every NC empty.</text>

    <rect x="1050" y="625" width="660" height="205" rx="6" fill="#eef3fb" stroke="#2874a6" stroke-width="2"/>
    <text x="1075" y="656" class="head">MODULE 2 - MODE</text>
    <text x="1075" y="685" class="small">5 V -> VCC/JD-VCC (jumper installed) | GND -> logic GND</text>
    <text x="1075" y="717" class="small">IN1 &lt;- U1 pin14   IN2 &lt;- pin13   IN3 &lt;- pin12   IN4 &lt;- pin11</text>
    <text x="1075" y="755" class="label">Contacts:</text><text x="1190" y="755" class="small">K1 NO->A   K2 NO->B   K3 NO->C   K4 NO->D</text>
    <text x="1075" y="788" class="small">Tie all four K1-K4 COM screw terminals to MODE COM. Leave every NC empty.</text>

    <rect x="1050" y="855" width="660" height="205" rx="6" fill="#fbf3e8" stroke="#b9770e" stroke-width="2"/>
    <text x="1075" y="886" class="head">MODULE 3 - TEMP</text>
    <text x="1075" y="915" class="small">5 V -> VCC/JD-VCC (jumper installed) | GND -> logic GND</text>
    <text x="1075" y="947" class="small">IN1 &lt;- U2 pin18   IN2 &lt;- pin17   IN3 &lt;- pin16   IN4 &lt;- pin15</text>
    <text x="1075" y="985" class="label">Contacts:</text><text x="1190" y="985" class="small">K1 NO->A   K2 NO->B   K3 NO->C   K4 NO->D</text>
    <text x="1075" y="1018" class="small">Tie all four K1-K4 COM screw terminals to TEMP COM. Leave every NC empty.</text>
  </g>

  <rect x="55" y="1140" width="1690" height="155" rx="8" class="warn"/>
  <text x="75" y="1175" class="head">Isolation and assembly rules</text>
  <text x="75" y="1208" class="small">1. FAN COM, MODE COM, and TEMP COM remain three separate nets. Never join them.</text>
  <text x="75" y="1238" class="small">2. Only relay COM and NO terminals connect to the factory climate PCB. No climate wire touches ESP32 GND, 5 V, VIN, or GPIO.</text>
  <text x="75" y="1268" class="small">3. Mount each 71.5 x 52.7 mm relay board on four M3 standoffs. Keep relay boards and wiring outside the ESP32 antenna keepout.</text>
  <text x="75" y="1320" class="tiny">Prime parts checked 2026-10-12: relay four-pack B0C2Z8JF5R; ULN2803A DIP pack B0H35YJFK8.</text>
</svg>
